name: deploy-plan

# 承認の前に、何がデプロイされるかを Job Summary に出す。deploy.yml の前段のジョブとして呼び、出力の sha を deploy.yml の ref に渡す。
# 前回デプロイした SHA は、呼び出し側の deploy workflow の直近の成功 run から読む: run 名（`... @ <ref>`）の ref がコミットならそれ、
# main ならその run の head_sha。main は github.sha に固定するので、承認を待つ間に main が進んでも、承認した内容・出る内容・head_sha が一致する。
# approval-environment を渡すと、承認が要るとき（前回の記録なし・ロールバック・notices に当たる変更）だけその名前を出力する。
# deploy.yml の approval-environment に渡せば、それ以外は承認なしで出る。
# migrations に SQL migration の置き場を渡すと、追加された migration を文ごとに分類し、追加系（CREATE TABLE / CREATE INDEX /
# ALTER TABLE ... ADD COLUMN）だけなら承認なしで出し、それ以外の文（DROP・DELETE・UPDATE・作り直しなど）か、既存の migration の書き換えがあれば止める
on:
  workflow_call:
    inputs:
      ref:
        description: デプロイする ref。main か、main 上のコミット SHA（ロールバック用）
        type: string
        required: true
      environment:
        type: string
        default: production
      notices:
        description: 変更があれば注意を出すパス。1 行に `<パスの先頭>=<注意書き>`（例 `migrations/=D1 migration を手で apply する`）
        type: string
        default: ""
      migrations:
        description: SQL migration の置き場（1 行に 1 つ、例 `migrations/`）。追加系の文だけの migration は承認なしで出し、それ以外は承認で止める
        type: string
        default: ""
      approval-environment:
        description: 承認が要るときに出力する Environment の名前（required reviewers を持つもの）。空なら承認の要否を判定しない
        type: string
        default: ""
    outputs:
      sha:
        description: デプロイするコミット SHA。deploy.yml の ref に渡す
        value: ${{ jobs.plan.outputs.sha }}
      approval-environment:
        description: 承認が要るときは入力の approval-environment、要らないときは空。deploy.yml の approval-environment に渡す
        value: ${{ jobs.plan.outputs.approval-environment }}

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      approval-environment: ${{ steps.summary.outputs.approval-environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: resolve
        name: ref guard
        env:
          REF: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          case "$REF" in
            main | refs/heads/main) candidate="$DISPATCH_SHA" ;;
            *) candidate="$REF" ;;
          esac
          if ! sha=$(git rev-parse --verify --quiet "${candidate}^{commit}") || ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::ref は main か、main 上のコミット SHA だけを指定できる: $REF"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # 判定と Summary は tools/deploy-plan（Go）が持つ。呼び出し側が固定したのと同じコミットのツールを使う。
      # job.workflow_* はこの（呼ばれた側の）workflow を指す。空のまま checkout すると既定ブランチになるので止める
      - name: tool ref guard
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository か job.workflow_sha が空で、deploy-plan のツールのコミットを決められない"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .deploy-plan-tool
          persist-credentials: false

      # 呼び出し側の cache を汚さないように、cache は使わない（ツールは標準ライブラリだけ）
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .deploy-plan-tool/tools/deploy-plan/go.mod
          cache: false

      - id: summary
        name: summary
        working-directory: .deploy-plan-tool/tools/deploy-plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_DIR: ${{ github.workspace }}
          SHA: ${{ steps.resolve.outputs.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          NOTICES: ${{ inputs.notices }}
          MIGRATIONS: ${{ inputs.migrations }}
          APPROVAL_ENVIRONMENT: ${{ inputs.approval-environment }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: go run .
