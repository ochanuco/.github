name: uv

# Python + uv の repo の check。依存の入れ方も repo ごとに違うので、run に含めて渡す
on:
  workflow_call:
    inputs:
      run:
        description: uv と Python を用意した後に実行するコマンド
        type: string
        required: true
      python-version:
        type: string
        default: "3.12"
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run
        run: ${{ inputs.run }}
