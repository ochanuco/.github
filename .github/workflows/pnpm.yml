name: pnpm

# Node.js + pnpm の repo の check。依存を入れてから run を実行する。
# repo ごとの手順は run で渡す。長くなるなら package.json の script にして、それを呼ぶ
on:
  workflow_call:
    inputs:
      run:
        description: 依存を入れた後に実行するコマンド
        type: string
        default: |
          pnpm run typecheck
          pnpm test
      node-version:
        type: string
        default: "24"
      timeout-minutes:
        type: number
        default: 15
    secrets:
      # Workers の repo の preflight（wrangler の dry-run、D1 の migration 一覧）用。渡さなければ空になる
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ${{ inputs.run }}
