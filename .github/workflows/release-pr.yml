name: release PR

# main の内容を production へ昇格させる PR を作る・更新する。
# 呼び出し側は main への push（と手動の workflow_dispatch）で呼ぶ。
# main への push ごとに release/production を main の snapshot で作り直すので、
# 昇格 PR は常に main 先端を反映する。「リリースする」判断 = この PR を merge する。
on:
  workflow_call:
    inputs:
      checklist:
        description: リリース PR の「Merge前チェック」に載せる Markdown のチェックリスト。空なら節ごと省く
        type: string
        default: ""
      body-command:
        description: リリース PR の本文で「含まれる変更」の前に差し込む Markdown を標準出力に書くコマンド。release/production を checkout した状態で実行する
        type: string
        default: ""
      deploy-note:
        description: リリース PR の「Deploy」に載せる、merge したときに何が起きるかの説明
        type: string
        required: true
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  create:
    name: create or update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # default GITHUB_TOKEN で作った PR は後続の pull_request workflow を発火
      # させず approval 待ちになり得る。また CODEOWNER が自分自身なので、App bot
      # を PR 作成者にして self-approve 制限を回避する。
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Ensure production branch exists
        env:
          PRODUCTION_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${PRODUCTION_RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "$remote" production >/dev/null; then
            {
              echo "::error::origin/production does not exist."
              echo "Create it intentionally from the current production baseline before enabling the production deploy."
              echo "Example: git push origin main:production"
            } >&2
            exit 1
          fi

      - name: Update release branch
        id: release_branch
        env:
          PRODUCTION_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${PRODUCTION_RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_release_sha="$(git ls-remote --heads "$remote" release/production | cut -f1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch production so we can build release/production on top of it,
          # and main which is the content we promote.
          git fetch --no-tags "$remote" production:refs/remotes/origin/production
          git fetch --no-tags "$remote" main:refs/remotes/origin/main

          main_sha="$(git rev-parse origin/main)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

          # Snapshot main's tree wholesale on top of production (no 3-way merge).
          # The release intent is "production := current main content", and release
          # commits never flow back to main, so the merge-base between the two
          # branches stays frozen at the last pre-squash-flow release. A frozen
          # base makes `git merge --squash` accumulate spurious conflicts over
          # time (add/add on files added after the base and later modified on
          # main, lockfile churn) — observed 2026-07-03 when 0037 + pnpm-lock
          # conflicts blocked release PR creation. read-tree sidesteps merging
          # entirely: the index becomes exactly main's tree, and each deploy is
          # one snapshot commit merged into production.
          git checkout -B release/production origin/production
          git read-tree -u --reset "origin/main^{tree}"
          if git diff --cached --quiet; then
            echo "::notice::No changes between production and main; nothing to commit."
          else
            git commit -m "release: sync production to main@${main_sha}"
          fi

          push_with_retry() {
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" = "3" ]; then
                return 1
              fi

              echo "::notice::git push failed; retrying in $((attempt * 5)) seconds."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          if [ -n "$remote_release_sha" ]; then
            push_with_retry git push --force-with-lease=refs/heads/release/production:"$remote_release_sha" "$remote" release/production:refs/heads/release/production
          else
            push_with_retry git push "$remote" release/production:refs/heads/release/production
          fi

      - name: Fetch production
        env:
          PRODUCTION_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${PRODUCTION_RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags "$remote" production:refs/remotes/origin/production

      # 判定と本文の整形は tools/release-pr（Go）が持つ。呼び出し側が固定したのと同じコミットのツールを使う。
      # job.workflow_* はこの（呼ばれた側の）workflow を指す。空のまま checkout すると既定ブランチになるので止める
      - name: tool ref guard
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository か job.workflow_sha が空で、release-pr のツールのコミットを決められない"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-pr-tool
          persist-credentials: false

      # 呼び出し側の cache を汚さないように、cache は使わない（ツールは標準ライブラリだけ）
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .release-pr-tool/tools/release-pr/go.mod
          cache: false

      # production との差がなければ has_changes=false を出して PR を触らない
      - name: Create or update production PR
        id: production_pr
        working-directory: .release-pr-tool/tools/release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REPO_DIR: ${{ github.workspace }}
          MAIN_SHA: ${{ steps.release_branch.outputs.main_sha }}
          CHECKLIST: ${{ inputs.checklist }}
          DEPLOY_NOTE: ${{ inputs.deploy-note }}
          BODY_COMMAND: ${{ inputs.body-command }}
        run: go run . pr

      - name: Check release PR branch is not behind
        if: steps.production_pr.outputs.has_changes == 'true'
        working-directory: .release-pr-tool/tools/release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: go run . check
